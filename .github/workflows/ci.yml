name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        # No live Supabase project in CI — these are build-time-only
        # placeholders (client creation reads them lazily; nothing here
        # actually connects out). Real values live in Vercel's env config.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
        run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Apply stub Supabase schema (auth/storage stand-ins) + all migrations
        run: |
          psql -f supabase/tests/stub_supabase_schema.sql
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done
